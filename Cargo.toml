[package]
name = "app-claude"
version = "0.1.0"
edition = "2021"
description = "SenClaw Space App: runs kanban cards in the user's own Claude Code CLI, verified before they close"

[[bin]]
name = "app-claude"
path = "src/main.rs"

[dependencies]
app-space-sdk = { path = "../senclaw/app-space-sdk" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.7", features = ["json"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
